<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot v3 - Con un LLM de verdad</title>

  <style>
    /* 1. Página: centra el chat en pantalla */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #e8eaf6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* 2. Ventana del chat */
    .chat {
      width: 420px;
      max-width: 100%;
      height: 640px;
      max-height: calc(100vh - 32px);
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cabecera {
      background: #059669;
      color: white;
      padding: 16px;
    }

    .cabecera h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .cabecera p {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .config {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .config label {
      font-size: 12px;
      opacity: 0.95;
    }

    .config input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .config small {
      font-size: 11px;
      opacity: 0.9;
    }

    /* 3. Área de mensajes y burbujas */
    .mensajes {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mensaje {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .mensaje.bot {
      background: #eef0f4;
      color: #1f2937;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .mensaje.usuario {
      background: #059669;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .mensaje.error {
      background: #fee2e2;
      color: #991b1b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* 4. Zona de escritura */
    .zona-entrada {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .zona-entrada input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
    }

    .zona-entrada input:focus {
      border-color: #059669;
    }

    .zona-entrada button {
      padding: 10px 18px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .zona-entrada button:hover {
      background: #047857;
    }

    .zona-entrada button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="chat">
    <header class="cabecera">
      <h1>ChatBot 3000 IA</h1>
      <p>La misma interfaz, pero el cerebro es un LLM</p>
      <div class="config">
        <label for="api-key">API key de OpenRouter</label>
        <input id="api-key" type="password" placeholder="Pega aquí tu clave (sk-or-v1-...)" autocomplete="off">
        <small>La clave se usa solo en tu navegador (no se guarda en archivos). Consigue tu API key en <a href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer" style="color: #fff; text-decoration: underline;">openrouter.ai/keys</a>. Modelo: <code>openrouter/free</code></small>
      </div>
    </header>

    <main id="mensajes" class="mensajes" aria-live="polite"></main>

    <div class="zona-entrada">
      <input id="entrada" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
      <button id="enviar" type="button">Enviar</button>
    </div>
  </div>

  <script>
    // 1. Configuración: el "cerebro" ahora es un servicio externo (API de chat)
    //    - OpenRouter ofrece modelos gratuitos, pero su disponibilidad puede cambiar.
    //    - "openrouter/free" intenta elegir un modelo gratuito disponible automáticamente.
    //    - La clave se introduce en la interfaz y solo se guarda en memoria mientras la página está abierta.
    const CONFIG = {
      endpoint: "https://openrouter.ai/api/v1/chat/completions",
      modelo: "openrouter/free"
    };

    // Personalidad del bot (system prompt)
    const PERSONALIDAD =
      "Eres ChatBot 3000, el asistente de una clase de desarrollo web. " +
      "Respondes siempre en español, de forma muy breve (1 o 2 frases), " +
      "con un toque de humor de programador cuando encaje.";

    // Historial de conversación para que el modelo tenga contexto
    const historico = [
      { role: "system", content: PERSONALIDAD }
    ];

    // 2. Llamada al LLM con fetch
    async function obtenerRespuestaIA(apiKey) {
      const mensajesRecientes = historico.slice(-11); // system + últimos 10 mensajes aprox.
      const cuerpo = {
        model: CONFIG.modelo,
        messages: [historico[0], ...mensajesRecientes.filter((m) => m.role !== "system")]
      };

      const respuesta = await fetch(CONFIG.endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify(cuerpo)
      });

      if (!respuesta.ok) {
        let detalle = "código " + respuesta.status;
        try {
          const errorData = await respuesta.json();
          const mensajeError = errorData?.error?.message || errorData?.message;
          if (mensajeError) {
            detalle = respuesta.status + " - " + mensajeError;
          }
        } catch {
          // Si no se puede leer el cuerpo de error, usamos el código HTTP
        }
        throw new Error(detalle);
      }

      const datos = await respuesta.json();
      const contenido = datos?.choices?.[0]?.message?.content;

      if (!contenido) {
        throw new Error("la respuesta de la API no contenía texto");
      }

      return contenido;
    }

    // 3. Interfaz: pintar mensajes y manejar eventos
    const mensajes = document.getElementById("mensajes");
    const entrada = document.getElementById("entrada");
    const botonEnviar = document.getElementById("enviar");
    const campoApiKey = document.getElementById("api-key");

    function agregarMensaje(texto, tipo = "bot") {
      const burbuja = document.createElement("div");
      burbuja.className = `mensaje ${tipo}`; // "bot", "usuario" o "error"
      burbuja.textContent = texto;
      mensajes.appendChild(burbuja);
      burbuja.scrollIntoView({ behavior: "smooth", block: "end" });
      return burbuja;
    }

    async function enviarMensaje() {
      const texto = entrada.value.trim();
      const apiKey = campoApiKey.value.trim();

      if (texto === "") return;

      agregarMensaje(texto, "usuario");
      entrada.value = "";

      if (!apiKey) {
        agregarMensaje("Introduce tu API key de OpenRouter en la parte superior para poder responder.", "error");
        return;
      }

      historico.push({ role: "user", content: texto });

      const escribiendo = agregarMensaje("...", "bot");
      botonEnviar.disabled = true;

      try {
        const respuesta = await obtenerRespuestaIA(apiKey);
        escribiendo.textContent = respuesta;
        escribiendo.className = "mensaje bot";
        historico.push({ role: "assistant", content: respuesta });
      } catch (error) {
        escribiendo.textContent = "No se pudo obtener respuesta de la IA: " + error.message;
        escribiendo.className = "mensaje error";
      } finally {
        botonEnviar.disabled = false;
        entrada.focus();
      }
    }

    botonEnviar.addEventListener("click", enviarMensaje);
    entrada.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter") {
        enviarMensaje();
      }
    });

    agregarMensaje("¡Hola! Introduce tu API key de OpenRouter y pregúntame lo que quieras.", "bot");
  </script>
</body>

</html>
