<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot v2 - Con interfaz de chat</title>

  <style>
    /* 1. Página: centra el chat en pantalla */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #e8eaf6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. Ventana del chat */
    .chat {
      width: 400px;
      height: 600px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column; /* cabecera, mensajes, entrada */
      overflow: hidden;
    }

    .cabecera {
      background: #4f46e5;
      color: white;
      padding: 16px;
    }

    .cabecera h1 {
      font-size: 20px;
    }

    .cabecera p {
      font-size: 13px;
      opacity: 0.85;
    }

    /* 3. Área de mensajes y burbujas */
    .mensajes {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mensaje {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .mensaje.bot {
      background: #eef0f4;
      color: #1f2937;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .mensaje.usuario {
      background: #4f46e5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* 4. Zona de escritura */
    .zona-entrada {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .zona-entrada input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
    }

    .zona-entrada input:focus {
      border-color: #4f46e5;
    }

    .zona-entrada button {
      padding: 10px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .zona-entrada button:hover {
      background: #4338ca;
    }
  </style>
</head>

<body>
  <div class="chat">
    <header class="cabecera">
      <h1>ChatBot 3000</h1>
      <p>HTML + CSS + JavaScript, sin servidores</p>
    </header>

    <main id="mensajes" class="mensajes" aria-live="polite"></main>

    <div class="zona-entrada">
      <input id="entrada" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
      <button id="enviar" type="button">Enviar</button>
    </div>
  </div>

  <script>
    // 1. Reglas del bot: palabras clave -> posibles respuestas
    const REGLAS = [
      {
        claves: ["hola", "buenas", "hey", "buenos dias", "buenos días"],
        respuestas: [
          "¡Hola! ¿En qué puedo ayudarte?",
          "¡Buenas! Si no sabes qué preguntar, escribe \"ayuda\"."
        ]
      },
      {
        claves: ["como estas", "cómo estás", "que tal", "qué tal"],
        respuestas: [
          "Muy bien, no puedo quejarme: soy puro JavaScript.",
          "Genial, esperando tus preguntas."
        ]
      },
      {
        claves: ["nombre", "quien eres", "quién eres"],
        respuestas: [
          "Soy ChatBot 3000, un bot de práctica hecho en una clase de desarrollo web."
        ]
      },
      {
        claves: ["chiste"],
        respuestas: [
          "¿Por qué los programadores confunden Halloween con Navidad? Porque OCT 31 == DEC 25.",
          "¿Cuántos programadores hacen falta para cambiar una bombilla? Ninguno: es un problema de hardware.",
          "Mi código no tiene errores, tiene características sorpresa."
        ]
      },
      {
        claves: ["gracias"],
        respuestas: [
          "¡De nada!",
          "Para eso estoy. Un placer."
        ]
      },
      {
        claves: ["adios", "adiós", "chao", "chau", "hasta luego"],
        respuestas: [
          "¡Hasta luego! Vuelve cuando quieras.",
          "¡Adiós! Y recuerda: comenta tu código."
        ]
      }
    ];

    const RESPUESTA_POR_DEFECTO =
      "Mmm... eso no lo tengo en mi lista. Escribe \"ayuda\" y te digo qué sé responder.";

    // 2. Lógica: elegir una respuesta según el mensaje
    function elegirAleatoria(opciones) {
      const indice = Math.floor(Math.random() * opciones.length);
      return opciones[indice];
    }

    function pensarRespuesta(mensaje) {
      const texto = mensaje.toLowerCase();

      if (texto.includes("ayuda")) {
        return "Sé hablar de: saludos, cómo estoy, mi nombre, chistes, la hora y despedidas. Prueba con \"chiste\".";
      }

      if (texto.includes("hora")) {
        return "Son las " + new Date().toLocaleTimeString("es-ES");
      }

      for (const regla of REGLAS) {
        const coincide = regla.claves.some((clave) => texto.includes(clave));
        if (coincide) {
          return elegirAleatoria(regla.respuestas);
        }
      }

      return RESPUESTA_POR_DEFECTO;
    }

    // 3. Interfaz: pintar mensajes y manejar eventos
    const mensajes = document.getElementById("mensajes");
    const entrada = document.getElementById("entrada");
    const botonEnviar = document.getElementById("enviar");

    function agregarMensaje(texto, emisor) {
      const burbuja = document.createElement("div");
      burbuja.className = `mensaje ${emisor}`; // "bot" o "usuario"
      burbuja.textContent = texto; // evita inyección de HTML
      mensajes.appendChild(burbuja);
      burbuja.scrollIntoView({ behavior: "smooth", block: "end" });
      return burbuja;
    }

    function enviarMensaje() {
      const texto = entrada.value.trim();
      if (texto === "") return;

      agregarMensaje(texto, "usuario");
      entrada.value = "";

      const escribiendo = agregarMensaje("...", "bot");
      setTimeout(() => {
        escribiendo.textContent = pensarRespuesta(texto);
      }, 700);
    }

    botonEnviar.addEventListener("click", enviarMensaje);
    entrada.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter") {
        enviarMensaje();
      }
    });

    agregarMensaje("¡Hola! Soy ChatBot 3000. Escribe \"ayuda\" para ver qué sé hacer.", "bot");
  </script>
</body>

</html>
