<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot v2 - Con interfaz de chat</title>

  <link rel="stylesheet" href="css/v2-chatbot-interfaz.css">
</head>

<body>
  <div class="chat">
    <header class="cabecera">
      <h1>ChatBot 3000</h1>
      <p>HTML + CSS + JavaScript, sin servidores</p>
    </header>

    <main id="mensajes" class="mensajes" aria-live="polite"></main>

    <div class="zona-entrada">
      <input id="entrada" type="text" placeholder="Escribe un mensaje..." autocomplete="off">
      <button id="enviar" type="button">Enviar</button>
    </div>
  </div>

  <script src="js/v2-chatbot-interfaz.js"></script>
</body>

</html>
